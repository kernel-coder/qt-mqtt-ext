name: CI

on:
  push:
  pull_request:

env:
  QT_VERSION: 6.8.3

jobs:
  linux:
    name: Linux ${{ matrix.platform }} · Qt 6.4 · broker tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64'

      - name: Start the test broker
        run: |
          docker compose -f broker/compose.yaml up -d
          for attempt in $(seq 1 60); do
            docker compose -f broker/compose.yaml logs mosquitto | grep -q "running" && break
            sleep 1
          done
          docker compose -f broker/compose.yaml logs mosquitto | grep -q "running"

      - name: Build and test
        run: scripts/test-linux.sh ${{ matrix.platform }}

  windows-mingw:
    name: Windows · MinGW
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Use the Qt MinGW toolchain
        shell: pwsh
        run: echo "$env:IQTA_TOOLS\mingw1310_64\bin" >> $env:GITHUB_PATH

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  ios:
    name: iOS · build only, without TLS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          autodesktop: true
          cache: true

      - name: Build
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Xcode -DMQTT_EXT_WITH_TLS=OFF -DMQTT_EXT_BUILD_TESTS=OFF
          cmake --build build --config Release --target MqttExt -- CODE_SIGNING_ALLOWED=NO

  android:
    name: Android arm64 · build only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true

      - name: Fetch the KDAB OpenSSL build for Android
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build
          git clone --depth 1 https://github.com/KDAB/android_openssl "$RUNNER_TEMP/android_openssl"

      - name: Build
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_ROOT_DIR/../gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            -DMQTT_EXT_ANDROID_OPENSSL_DIR="$RUNNER_TEMP/android_openssl/ssl_3"
          cmake --build build
