per_listener_settings false
allow_anonymous false
password_file /run/mosquitto/passwd
acl_file /run/mosquitto/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
protocol mqtt

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /run/mosquitto/server.key
tls_version tlsv1.2

listener 9001
protocol websockets

listener 9443
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /run/mosquitto/server.key
tls_version tlsv1.2
